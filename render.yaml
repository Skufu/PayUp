services:
  - type: web
    name: payup-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: GIN_MODE
        value: release
      # Set these in Render dashboard as "Secret" values:
      # DATABASE_URL - Your Neon/Supabase PostgreSQL connection string
      # JWT_SECRET - Generate with: openssl rand -base64 32
      # CORS_ORIGINS - e.g., https://your-app.vercel.app
      # GOOGLE_CLIENT_ID - For Google OAuth (optional)
      # CLOUDINARY_URL - For image uploads (optional)
      # VAPID_PUBLIC_KEY - For push notifications (optional)
      # VAPID_PRIVATE_KEY - For push notifications (optional)
