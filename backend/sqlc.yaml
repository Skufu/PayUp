version: "2"

sql:
  - engine: "postgresql"
    schema:
      - "sql/schema.sql"
    queries:
      - "sql/queries/"
    gen:
      go:
        package: "sqlcdb"
        out: "internal/db/sqlcdb"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          # Map numeric to string (we convert to float64 at the API boundary).
          - db_type: "pg_catalog.numeric"
            go_type: "string"
          - db_type: "pg_catalog.jsonb"
            go_type:
              type: "[]byte"

